<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Readiness for SMBs — The Future Thinker</title>
  <meta name="description" content="A calm, practical assessment for SMBs to measure AI readiness with clear next steps." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] } } }
    }
  </script>
  <style>
    html { scroll-behavior: smooth; }
  </style>
</head>
<body class="min-h-screen bg-white text-neutral-900 antialiased selection:bg-black selection:text-white">
  <header class="sticky top-0 z-30 backdrop-blur supports-[backdrop-filter]:bg-white/60 border-b border-neutral-200">
    <div class="mx-auto max-w-6xl px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-6 w-6 rounded-full bg-black" aria-hidden></div>
        <span class="font-medium tracking-tight">The Future Thinker</span>
      </div>
      <a id="contactLink" class="inline-flex items-center gap-2 rounded-full border border-neutral-300 px-4 py-2 text-sm hover:bg-neutral-100 transition" href="#">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" opacity="0"></path><path d="M22 6l-10 7L2 6"></path></svg>
        Contact
      </a>
    </div>
  </header>

  <main id="app" class="mx-auto max-w-6xl px-4"></main>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const CONTACT = {
      ctaLink: 'https://cal.com/thefuturethinker/20min',
      email: 'hello@thefuturethinker.com',
      phone: '+48 600 000 000'
    };

    const SECTIONS = [
      {
        key:'strategy',
        title:'Strategy & Value',
        questions:[
          'We have 1–3 clear AI use-cases tied to business KPIs (e.g., tickets, lead time, cost).',
          'There is an owner for AI outcomes with budget and decision rights.',
          'We measure baseline performance and can compare before/after results.'
        ]
      },
      {
        key:'data',
        title:'Data & Knowledge',
        questions:[
          'Key documents are organized and searchable (Drive/SharePoint) with access controls.',
          'Customer/system data can be exported for pilots (CSV/API) without heavy IT work.',
          'We know which data is sensitive (PII/financial) and where it lives.'
        ]
      },
      {
        key:'process',
        title:'Processes & Automation',
        questions:[
          'We have a documented process that repeats weekly (support, orders, invoicing).',
          'Our tools can be connected via API/Zapier/Make/n8n (or we can email-parse).',
          'We can pilot changes on one team without blocking the whole company.'
        ]
      },
      {
        key:'security',
        title:'Security & Privacy',
        questions:[
          'We can run pilots inside our tenant (Microsoft 365/Google Workspace).',
          'We apply basic guardrails: least privilege, logging, data retention policies.',
          'We can sign a simple DPA and complete a DPIA-lite for the pilot.'
        ]
      },
      {
        key:'people',
        title:'People & Adoption',
        questions:[
          'Pilot team is available for 60–90 min of training and gives feedback weekly.',
          'We have a human-in-the-loop step for edge cases and escalation.',
          'Leaders support a 6–8 week pilot and will celebrate quick wins.'
        ]
      },
      {
        key:'ops',
        title:'Operations & Scale',
        questions:[
          'We can monitor usage and outcomes (simple dashboard or sheet).',
          'We budget a small monthly retainer to maintain/improve the solution.',
          'We have a shortlist of next processes if the pilot succeeds.'
        ]
      }
    ];

    const CHOICES = [
      { label:'No', value:0, hint:'Not in place' },
      { label:'Partial', value:1, hint:'Somewhat' },
      { label:'Emerging', value:2, hint:'In progress' },
      { label:'Good', value:3, hint:'Mostly' },
      { label:'Excellent', value:4, hint:'Fully in place' }
    ];

    function bandFromScore(pct){
      if (pct >= 80) return { label:'Ready now', pill:'bg-emerald-50 text-emerald-600' };
      if (pct >= 60) return { label:'Ready with light prep', pill:'bg-blue-50 text-blue-600' };
      if (pct >= 40) return { label:'Needs preparation', pill:'bg-amber-50 text-amber-600' };
      return { label:'Prepare first', pill:'bg-rose-50 text-rose-600' };
    }

    function Question({text, value, onSelect}){
      return (
        <div className="grid gap-3 md:grid-cols-5 md:items-center">
          <div className="md:col-span-3 text-sm md:text-base text-neutral-800">{text}</div>
          <div className="md:col-span-2 flex flex-wrap gap-2">
            {CHOICES.map(c=>(
              <button key={c.value}
                onClick={()=>onSelect(c.value)}
                className={'rounded-full border px-3 py-1.5 text-sm transition '+(value===c.value?'bg-black text-white border-black':'border-neutral-300 hover:bg-neutral-100')}>
                {c.label}<span className="ml-1.5 text-xs opacity-70">{c.hint}</span>
              </button>
            ))}
          </div>
        </div>
      );
    }

    function Section({section, answers, setAnswer, score}){
      return (
        <div className="rounded-3xl border border-neutral-200 p-6 md:p-8 mb-10">
          <div className="flex items-center gap-3">
            <h2 className="text-xl font-semibold tracking-tight">{section.title}</h2>
            <div className="ml-auto text-sm text-neutral-600">{score}%</div>
          </div>
          <div className="mt-6 space-y-6">
            {section.questions.map((q, idx)=>(
              <Question
                key={idx}
                text={q}
                value={answers[`${section.key}-${idx}`]}
                onSelect={(v)=> setAnswer(`${section.key}-${idx}`, v)}
              />
            ))}
          </div>
        </div>
      );
    }

    function Summary({sectionScores, overall}){
      const band = bandFromScore(overall);
      const meaning = overall>=80
        ? 'You can start a PoC now. Pick one process, confirm KPIs, and go live in 6–8 weeks.'
        : overall>=60
          ? 'You are close. Tidy access/guardrails and proceed with a focused pilot.'
          : overall>=40
            ? 'Do a 2‑week Readiness Sprint to address gaps, then run a pilot.'
            : 'Prepare foundations first (data access, owner, basic guardrails), then schedule a sprint.';
      return (
        <div className="rounded-3xl border border-neutral-200 p-6 md:p-10 bg-neutral-50/40">
          <div className="flex flex-wrap items-end gap-4">
            <h2 className="text-2xl md:text-3xl font-semibold tracking-tight">Your AI Readiness Summary</h2>
            <div className={"ml-auto rounded-full px-4 py-1.5 text-sm border border-neutral-200 "+band.pill}>{band.label}</div>
          </div>
          <div className="mt-6 grid md:grid-cols-4 gap-6">
            <div className="col-span-1 flex flex-col items-center justify-center rounded-2xl bg-white border border-neutral-200 p-6">
              <div className="text-6xl font-semibold tracking-tight"><span>{overall}</span><span className="text-2xl">%</span></div>
              <div className="mt-1 text-sm text-neutral-600">Overall readiness</div>
            </div>
            <div className="col-span-3 grid sm:grid-cols-3 gap-4">
              {SECTIONS.map(sec=>{
                const pct = sectionScores[sec.key] || 0;
                return (
                  <div key={sec.key} className="rounded-2xl bg-white border border-neutral-200 p-4">
                    <div className="text-sm text-neutral-600">{sec.title}</div>
                    <div className="mt-1 text-2xl font-semibold">{pct}%</div>
                    <div className="mt-2 h-2 w-full overflow-hidden rounded-full bg-neutral-200">
                      <div className="h-full bg-black" style={{width:`${pct}%`}}></div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
          <div className="mt-8 grid md:grid-cols-3 gap-6">
            <div className="rounded-2xl border border-neutral-200 bg-white p-5">
              <h3 className="font-medium">What this means</h3>
              <p className="mt-2 text-sm text-neutral-700">{meaning}</p>
            </div>
            <div className="rounded-2xl border border-neutral-200 bg-white p-5">
              <h3 className="font-medium">Suggested next step</h3>
              <ul className="mt-2 list-disc pl-5 text-sm text-neutral-700 space-y-1">
                <li>Baseline 1–2 KPIs for your target process</li>
                <li>Confirm tenant and data sources (Drive/SharePoint, CRM/ERP)</li>
                <li>Book a 20‑min call to plan a 2‑week Readiness Sprint</li>
              </ul>
            </div>
            <div className="rounded-2xl border border-neutral-200 bg-white p-5">
              <h3 className="font-medium">What you’ll receive</h3>
              <ul className="mt-2 list-disc pl-5 text-sm text-neutral-700 space-y-1">
                <li>Mini AI policy + DPIA‑lite templates</li>
                <li>Top 3 quick wins with effort/impact</li>
                <li>Pilot plan (6–8 weeks) and fixed price</li>
              </ul>
            </div>
          </div>
          <div className="mt-10 flex flex-col md:flex-row items-center gap-4">
            <a className="inline-flex items-center gap-2 rounded-2xl bg-black px-6 py-3 text-white hover:opacity-90 transition" href={CONTACT.ctaLink}>Book a 20‑min call →</a>
            <div className="flex items-center gap-4 text-sm text-neutral-700">
              <a className="inline-flex items-center gap-2 hover:underline" href={'mailto:'+CONTACT.email}>✉️ <span>{CONTACT.email}</span></a>
              <span className="hidden md:inline">•</span>
              <a className="inline-flex items-center gap-2 hover:underline" href={'tel:'+CONTACT.phone}>📞 <span>{CONTACT.phone}</span></a>
            </div>
          </div>
        </div>
      );
    }

    function App(){
      const [answers, setAnswers] = React.useState({});

      const totalQuestions = SECTIONS.reduce((a,s)=>a+s.questions.length,0);
      const completed = Object.keys(answers).length;
      const progressPct = Math.round((completed/totalQuestions)*100);

      const sectionScores = React.useMemo(()=>{
        const scores = {};
        SECTIONS.forEach(sec=>{
          const max = sec.questions.length*4;
          let got=0;
          sec.questions.forEach((_,idx)=>{
            const val = answers[`${sec.key}-${idx}`];
            if (val!==undefined) got+=val;
          });
          scores[sec.key] = max? Math.round((got/max)*100):0;
        });
        return scores;
      }, [answers]);

      const overall = React.useMemo(()=>{
        const total = SECTIONS.reduce((sum,sec)=> sum+(sectionScores[sec.key]||0),0);
        return SECTIONS.length? Math.round(total/SECTIONS.length):0;
      }, [sectionScores]);

      const setAnswer = (key,val) => setAnswers(prev=>({ ...prev, [key]:val }));

      return (
        <div>
          <section className="py-16 md:py-20">
            <div className="grid md:grid-cols-2 gap-10 items-center">
              <div>
                <h1 className="text-4xl md:text-5xl font-semibold tracking-tight leading-tight">AI Readiness for SMBs</h1>
                <p className="mt-4 text-lg text-neutral-600">A calm, practical assessment that shows how ready your company is to pilot AI safely and get value in weeks, not years.</p>
                <ul className="mt-6 space-y-2 text-neutral-700">
                  <li className="flex items-start gap-3">✅ 10–12 minutes, plain language</li>
                  <li className="flex items-start gap-3">✅ Score by section + overall readiness %</li>
                  <li className="flex items-start gap-3">✅ Summary + next steps + option to book a call</li>
                </ul>
              </div>
              <div className="rounded-3xl border border-neutral-200 p-6 md:p-8 bg-neutral-50/50">
                <div className="flex items-center justify-between">
                  <span className="text-sm text-neutral-600">Completion</span>
                  <span className="text-sm font-medium">{progressPct}%</span>
                </div>
                <div className="mt-2 h-2 w-full overflow-hidden rounded-full bg-neutral-200">
                  <div className="h-full bg-black transition-all" style={{width:progressPct+'%'}}></div>
                </div>
                <div className="mt-6 grid grid-cols-3 gap-2 text-center">
                  <div className="rounded-xl bg-white border border-neutral-200 p-3">
                    <div className="mx-auto h-5 w-5">🛡️</div>
                    <div className="mt-1 text-xs text-neutral-600">Security</div>
                  </div>
                  <div className="rounded-xl bg-white border border-neutral-200 p-3">
                    <div className="mx-auto h-5 w-5">🔁</div>
                    <div className="mt-1 text-xs text-neutral-600">Processes</div>
                  </div>
                  <div className="rounded-xl bg-white border border-neutral-200 p-3">
                    <div className="mx-auto h-5 w-5">📈</div>
                    <div className="mt-1 text-xs text-neutral-600">Value</div>
                  </div>
                </div>
                <a href="#assessment" className="mt-6 inline-flex w-full items-center justify-center gap-2 rounded-2xl bg-black px-5 py-3 text-white hover:opacity-90 transition">Start Assessment →</a>
              </div>
            </div>
          </section>

          <section id="assessment" className="pb-20">
            {SECTIONS.map(sec=>(
              <Section key={sec.key} section={sec} answers={answers} setAnswer={setAnswer} score={sectionScores[sec.key]}/>
            ))}
          </section>

          <section className="pb-32">
            <Summary sectionScores={sectionScores} overall={overall}/>
          </section>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<App />);

    document.getElementById('contactLink').href = CONTACT.ctaLink;
  </script>
</body>
</html>
