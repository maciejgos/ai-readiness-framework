name: Continuous Integration

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --coverage

      - name: Check coverage threshold
        run: |
          COVERAGE=$(npx --yes nyc report --reporter=text-summary | grep 'Statements' | awk '{print $4}' | sed 's/%//')
          THRESHOLD=80
          if [ "$(echo "$COVERAGE < $THRESHOLD" | bc)" -eq 1 ]; then
            echo "Test coverage ($COVERAGE%) is below threshold ($THRESHOLD%)"
            exit 1
          else
            echo "Test coverage ($COVERAGE%) meets threshold ($THRESHOLD%)"
          fi
        if: always()

